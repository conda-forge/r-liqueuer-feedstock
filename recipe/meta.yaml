{% set version = "0.0.5" %}
{% set posix = 'm2-' if win else '' %}

package:
  name: r-liqueuer
  version: {{ version|replace("-", "_") }}

source:
  url:
    - {{ cran_mirror }}/src/contrib/liqueueR_{{ version }}.tar.gz
    - {{ cran_mirror }}/src/contrib/Archive/liqueueR/liqueueR_{{ version }}.tar.gz
  sha256: d464041bc1bd643a48c7b6aa3e3dcfd72a1ba92c74accd2dee9c9b30f42c43e6

build:
  number: 0
  noarch: generic
  rpaths:
    - lib/R/lib/
    - lib/

requirements:
  build:
    - {{ posix }}zip               # [win]
    - cross-r-base {{ r_base }}    # [build_platform != target_platform]
  host:
    - r-base
    - r-itertools
  run:
    - r-base
    - r-itertools

test:
  commands:
    - $R -e "library('liqueueR')"           # [not win]
    - "\"%R%\" -e \"library('liqueueR')\""  # [win]

about:
  home: https://github.com/DataWookie/liqueueR
  license: GPL-3.0-only
  summary: 'Provides three classes: Queue, PriorityQueue and Stack. Queue is just a "plain vanilla" FIFO queue; PriorityQueue orders items according to priority. Stack implements LIFO.'
  license_family: GPL3
  license_file:
    - {{ environ["PREFIX"] }}/lib/R/share/licenses/GPL-3

extra:
  recipe-maintainers:
    - conda-forge/r
    - xhochy

